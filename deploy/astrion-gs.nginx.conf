# /etc/nginx/sites-available/astrion-gs.conf
#
# El unico de los tres sitios con algo especial. Tres lineas que no lleva un
# proxy normal y sin las cuales el juego no conecta:
#
#   Upgrade / Connection  — sin ellas nginx contesta 200 a un handshake de
#     WebSocket y el cliente se queda esperando para siempre.
#   proxy_http_version 1.1 — HTTP/1.0 no sabe de upgrades.
#   proxy_read_timeout    — el mundo puede pasar minutos sin mandar nada si el
#     jugador esta quieto; con el timeout por defecto (60s) nginx corta la
#     conexion sola y el jugador ve una desconexion que nadie provoco.
server {
    listen 80;
    listen [::]:80;
    server_name astrion-gs.turname.mx;

    location /ws {
        proxy_pass         http://127.0.0.1:5210;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /health {
        proxy_pass http://127.0.0.1:5210;
    }

    location / { return 404; }
}
